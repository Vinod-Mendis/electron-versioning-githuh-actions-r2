appId: com.flyxto.versionr2
productName: Version R2
directories:
  output: dist
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.gitignore,.npmrc,package-lock.json}"
  - "!scripts/*"
  - "!.github/*"
asarUnpack:
  - resources/**
win:
  executableName: version-r2
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
publish:
  provider: generic
  # electron-builder only expands env names made of letters. FEED_URL is set from the R2_PUBLIC_URL secret.
  url: ${env.FEED_URL}
